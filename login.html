<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tax Database System</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <button class="dark-mode-toggle" onclick="toggleDarkMode()" title="Toggle Dark Mode">
        <span class="moon-icon icon">&#127769;</span>
        <span class="sun-icon icon">&#9728;&#65039;</span>
    </button>

    <div class="login-container">
        <div class="login-card">
            <h2>Corporate Tax System</h2>
            <p>Silakan masuk ke akun Anda</p>
            <form action="/login" method="POST">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" required autocomplete="off" data-testid="login-username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required data-testid="login-password">
                </div>
                <button type="submit" class="btn-login" data-testid="login-submit">Login</button>
            </form>
        </div>
    </div>

    <script>
        function toggleDarkMode() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }
        (function() {
            var t = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</body>
</html>
