<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tax Database System</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <script>
        (function(){var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t)})();
    </script>

    <button class="dark-mode-toggle" onclick="(function(){var h=document.documentElement,c=h.getAttribute('data-theme')||'light',n=c==='dark'?'light':'dark';h.setAttribute('data-theme',n);localStorage.setItem('theme',n);document.getElementById('dm-login-icon').innerHTML=n==='dark'?'&#9728;&#65039;':'&#127769;'})()" title="Toggle Dark Mode" data-testid="login-dark-toggle" style="z-index:100;">
        <span id="dm-login-icon">&#127769;</span>
    </button>

    <div class="login-container">
        <div class="login-card">
            <h2>Corporate Tax System</h2>
            <p>Silakan masuk ke akun Anda</p>
            <form action="/login" method="POST">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" required autocomplete="off" data-testid="login-username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required data-testid="login-password">
                </div>
                <button type="submit" class="btn-login" data-testid="login-submit">Login</button>
            </form>
        </div>
    </div>

    <script>
        (function(){
            var t = localStorage.getItem('theme') || 'light';
            var icon = document.getElementById('dm-login-icon');
            if (icon && t === 'dark') icon.innerHTML = '&#9728;&#65039;';
        })();
    </script>
</body>
</html>
