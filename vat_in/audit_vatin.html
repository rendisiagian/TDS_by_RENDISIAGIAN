<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit VAT IN</title>
  <script src="/theme.js"></script>
  <script src="/export.js"></script>
  <link rel="stylesheet" href="/style.css">
  <script src="/sidebar.js"></script>
  <style>
    .warn-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      font-weight: 700;
      background: rgba(245, 158, 11, 0.15);
      color: #d97706;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .table-responsive {
      max-height: calc(100vh - 340px);
    }
    .text-muted {
      color: var(--text-tertiary) !important;
    }
    .diff-pos { color: #10b981; font-weight: 700; }
    .diff-neg { color: #ef4444; font-weight: 700; }
  </style>
</head>
<body>
  <script>(function(){var t=localStorage.getItem("theme")||"light";document.documentElement.setAttribute("data-theme",t)})()</script>

  <div class="app-wrapper">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <header class="header">
        <h2>Audit Integritas Faktur Masukan (VAT IN)</h2>
        <div class="user-profile">
          <span id="header-user-name"></span>
          <a href="/logout" class="btn-logout">Logout</a>
        </div>
      </header>

      <div class="container">
        <div class="card" style="margin-bottom: 1rem;">
          <div class="card-header-padding" style="display:flex; justify-content:space-between; align-items:center; gap: 1rem; flex-wrap: wrap;">
            <div>
              <h3 class="title-primary" style="margin:0; border-left-color:#f59e0b;">⚠️ Temuan Integritas</h3>
              <div id="audit-summary" class="text-muted" style="margin-top:0.25rem;"></div>
            </div>
            <button class="btn-simpan" style="background-color:#2563eb;" onclick="reloadAudit()">🔄 Refresh</button>
          </div>
        </div>

        <div class="card" style="margin-bottom: 1rem;">
          <div class="card-header-padding">
            <h3 class="title-primary" style="border-left-color:#ef4444; margin:0;">Pengganti (ada) tapi Normal induk tidak ada</h3>
            <div class="warn-badge" style="margin-top:0.5rem;">Jumlah: <span id="cnt-orphan"></span></div>
          </div>
          <div class="table-responsive">
            <table class="table" style="width:100%;">
              <thead>
                <tr>
                  <th class="text-center">No.</th>
                  <th>No. Faktur</th>
                  <th>Status</th>
                  <th class="text-right">PPN</th>
                </tr>
              </thead>
              <tbody id="body-orphan"></tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <div class="card-header-padding">
            <h3 class="title-primary" style="border-left-color:#f59e0b; margin:0;">Normal yang sudah digantikan oleh Pengganti</h3>
            <div class="warn-badge" style="margin-top:0.5rem;">Jumlah: <span id="cnt-replaced"></span></div>
          </div>
          <div class="table-responsive">
            <table class="table" style="width:100%;">
              <thead>
                <tr>
                  <th class="text-center">No.</th>
                  <th>No. Faktur Normal</th>
                  <th>Normal Status</th>
                  <th>Pengganti Terakhir</th>
                  <th class="text-right">PPN Normal</th>
                  <th class="text-right">PPN Pengganti</th>
                </tr>
              </thead>
              <tbody id="body-replaced"></tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script>
    let aktifEntitas = localStorage.getItem('lastEntitas') || 'BBS';

    let chartPPN = null;

    async function loadAudit() {
      try {
        const res = await fetch('/api/audit-vatin?entitas=' + aktifEntitas);

        // BUG-6 FIX: Cek HTTP status sebelum akses payload
        if (!res.ok) {
          throw new Error('Server error: HTTP ' + res.status);
        }

        const payload = await res.json();

        // BUG-6 FIX: Guard — pastikan payload berstruktur benar
        const orphan = Array.isArray(payload.orphan_replacements) ? payload.orphan_replacements : [];
        const replaced = Array.isArray(payload.replaced_normals) ? payload.replaced_normals : [];

        document.getElementById('cnt-orphan').textContent = orphan.length;
        document.getElementById('cnt-replaced').textContent = replaced.length;

        document.getElementById('audit-summary').innerHTML = `Ditemukan <b>${orphan.length + replaced.length}</b> anomali untuk entitas <b>${aktifEntitas}</b>.`;

        const formatRupiah = (n) => "Rp " + Number(n || 0).toLocaleString('id-ID');

        const bodyOrphan = document.getElementById('body-orphan');
        bodyOrphan.innerHTML = '';
        if (orphan.length === 0) {
          bodyOrphan.innerHTML = '<tr><td colspan="4" class="text-center text-muted" style="padding:20px;">Tidak ada data anomali.</td></tr>';
        } else {
          orphan.forEach((r, i) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="text-center">${i+1}</td>
              <td style="font-weight:700; color:#2563eb;">${r.no_faktur}</td>
              <td>${r.status_faktur}</td>
              <td class="text-right">${formatRupiah(r.ppn)}</td>
            `;
            bodyOrphan.appendChild(tr);
          });
        }

        const bodyReplaced = document.getElementById('body-replaced');
        bodyReplaced.innerHTML = '';
        if (replaced.length === 0) {
          bodyReplaced.innerHTML = '<tr><td colspan="6" class="text-center text-muted" style="padding:20px;">Tidak ada data anomali.</td></tr>';
        } else {
          replaced.forEach((r, i) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="text-center">${i+1}</td>
              <td style="font-weight:700;">${r.normal_no_faktur}</td>
              <td>${r.normal_status_faktur}</td>
              <td style="color:#f59e0b; font-weight:700;">${r.latest_pengganti_no_faktur}</td>
              <td class="text-right">${formatRupiah(r.normal_ppn)}</td>
              <td class="text-right">${formatRupiah(r.latest_pengganti_ppn)}</td>
            `;
            bodyReplaced.appendChild(tr);
          });
        }
      } catch (e) {
        console.error('loadAudit error', e);
        // BUG-6 FIX: Tampilkan pesan error di UI agar user tahu ada masalah
        const errorMsg = `<tr><td colspan="4" class="text-center" style="padding:20px; color:#ef4444;">&#9888; Gagal memuat data: ${e.message}</td></tr>`;
        const bodyOrphan = document.getElementById('body-orphan');
        const bodyReplaced = document.getElementById('body-replaced');
        if (bodyOrphan) bodyOrphan.innerHTML = errorMsg;
        if (bodyReplaced) bodyReplaced.innerHTML = errorMsg.replace('colspan="4"', 'colspan="6"');
        const summaryEl = document.getElementById('audit-summary');
        if (summaryEl) summaryEl.innerHTML = `<span style="color:#ef4444;">&#9888; Gagal memuat audit: ${e.message}</span>`;
      }
    }

    window.gantiEntitas = function(entitas) {
      aktifEntitas = entitas;
      localStorage.setItem('lastEntitas', entitas);
      loadAudit();
    };

    function reloadAudit() {
      loadAudit();
    }

    fetch('/sidebar.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('sidebar-container').innerHTML = html;
      });

    loadAudit();
  </script>
</body>
</html>
