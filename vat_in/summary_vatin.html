<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summary - Perbandingan Faktur</title>
    <script src="/theme.js"></script>
    <script src="/toast.js"></script>
    <script src="/utils.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="/export.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@latest/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/sidebar.js"></script>
</head>
<body>
    
    <div class="app-wrapper">
        <div id="sidebar-container"></div>
        
        <main class="main-content">
            <header class="header">
                <h2>Laporan Rekapitulasi Pajak</h2>
                <div class="user-profile"><span id="header-user-name"></span>
                    <div class="toolbar-actions">
                        <!-- BUG-4 FIX: Tombol disabled saat loading, baru aktif setelah data siap -->
                        <button id="btn-export-summary" class="btn-toolbar btn-toolbar-export" onclick="showExportMenu(event, 'tabel-summary', 'summary_' + aktifEntitas)" data-testid="btn-export-summary" disabled style="opacity:0.5;cursor:not-allowed;">Export</button>
                        <button class="btn-toolbar btn-toolbar-print" onclick="window.print()" data-testid="btn-print-summary">&#128424; Print</button>
                    </div>
                    <a href="/logout" class="btn-logout">Logout</a>
                </div>
            </header>

            <div class="container">
                <!-- Charts -->
                <div class="chart-grid" data-testid="chart-grid">
                    <div class="chart-container">
                        <h3 class="title-primary" style="margin-bottom: 1rem; font-size: 1rem;">Tren PPN per Periode</h3>
                        <canvas id="chartPPN"></canvas>
                    </div>
                    <div class="chart-container">
                        <h3 class="title-success" style="margin-bottom: 1rem; font-size: 1rem;">Jumlah Dokumen per Periode</h3>
                        <canvas id="chartDokumen"></canvas>
                    </div>
                </div>

                <!-- Table -->
                <div class="card">
                    <div class="card-header-padding">
                        <h3 class="title-primary" style="border-left-color: #8b5cf6; margin: 0; padding-bottom: 15px;">Perbandingan Realisasi vs Tanggal Faktur</h3>
                    </div>
                    
                    <div class="table-responsive">
                        <table id="tabel-summary">
                            <thead>
                                <tr>
                                    <th rowspan="2" class="border-right-middle text-center">Bulan / Periode</th>
                                    <th colspan="2" class="header-group">Berdasarkan Tanggal Tukar</th>
                                    <th colspan="2" class="header-group">Berdasarkan Tanggal Faktur</th>
                                    <th rowspan="2" class="text-center-middle">Selisih PPN (Tukar - Faktur)</th>
                                </tr>
                                <tr>
                                    <th class="text-center">Jml Dokumen</th>
                                    <th class="text-center border-right-middle">Total PPN</th>
                                    <th class="text-center">Jml Dokumen</th>
                                    <th class="text-center border-right-middle">Total PPN</th>
                                </tr>
                            </thead>
                            <tbody id="body-compare"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let aktifEntitas = localStorage.getItem('lastEntitas') || 'BBS';
        let chartPPN = null, chartDokumen = null;

        fetch('/sidebar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;
                const currentPath = window.location.pathname;
                document.querySelectorAll('.sidebar-link').forEach(link => {
                    if (link.getAttribute('href') === currentPath) link.classList.add('active');
                });
                const sidebarSelect = document.getElementById('global-entity-select');
                if (sidebarSelect) sidebarSelect.value = aktifEntitas;
            });

        window.gantiEntitas = function(entitas) {
            aktifEntitas = entitas;
            localStorage.setItem('lastEntitas', entitas);
            const sidebarSelect = document.getElementById('global-entity-select');
            if (sidebarSelect && sidebarSelect.value !== entitas) sidebarSelect.value = entitas;
            loadSummary();
        };

        // Re-render charts when dark mode toggles
        var _origToggle = window.__toggleDarkMode;
        window.__toggleDarkMode = function() {
            if (_origToggle) _origToggle();
            setTimeout(function() { loadSummary(); }, 200);
        };

        function getChartColors() {
            var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            return {
                text: isDark ? '#cbd5e1' : '#334155',
                grid: isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.08)',
                ppnTukar: '#3b82f6',
                ppnFaktur: '#10b981',
                docTukar: '#f59e0b',
                docFaktur: '#8b5cf6'
            };
        }

        async function loadSummary() {
            try {
                // BUG-4 FIX: Disable tombol export selama loading
                const btnExport = document.getElementById('btn-export-summary');
                if (btnExport) { btnExport.disabled = true; btnExport.style.opacity = '0.5'; btnExport.style.cursor = 'not-allowed'; }

                const response = await fetch('/api/summary?entitas=' + aktifEntitas);

                // BUG-5 FIX: Cek HTTP status sebelum akses data
                if (!response.ok) {
                    throw new Error('Server error: HTTP ' + response.status);
                }

                let data = await response.json();

                // BUG-5 FIX: Guard — pastikan data berupa array sebelum sort
                if (!Array.isArray(data)) {
                    console.error('API /api/summary tidak mengembalikan array:', data);
                    data = [];
                }

                // BUG-9 FIX: Sort periode aman meski ada nilai null/undefined
                data.sort((a, b) => {
                    if (!a.periode || !b.periode) return 0;
                    const [monthA, yearA] = a.periode.split('-').map(Number);
                    const [monthB, yearB] = b.periode.split('-').map(Number);
                    if (yearA !== yearB) return yearA - yearB;
                    return monthA - monthB;
                });
                const tbody = document.getElementById('body-compare');
                tbody.innerHTML = '';


                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center" style="padding: 20px; color: var(--text-tertiary);">Belum ada data rekapitulasi untuk entitas ini.</td></tr>';
                    if (chartPPN) { chartPPN.destroy(); chartPPN = null; }
                    if (chartDokumen) { chartDokumen.destroy(); chartDokumen = null; }
                    // BUG-4 FIX: Tetap enable export meski data kosong (user mungkin mau export file kosong)
                    if (btnExport) { btnExport.disabled = false; btnExport.style.opacity = '1'; btnExport.style.cursor = 'pointer'; }
                    return;
                }

                // Populate table
                data.forEach(row => {
                    const tr = document.createElement('tr');
                    const selisih = row.ppn_tukar - row.ppn_faktur;
                    const classSelisih = selisih >= 0 ? 'diff-pos' : 'diff-neg';
                    tr.innerHTML = 
                        '<td class="text-bold border-right-middle text-center">' + row.periode + '</td>' +
                        '<td class="text-center">' + row.jml_tukar + ' Dokumen</td>' +
                        '<td class="border-right-middle text-right">' + formatRupiah(row.ppn_tukar) + '</td>' +
                        '<td class="text-center">' + row.jml_faktur + ' Dokumen</td>' +
                        '<td class="border-right-middle text-right">' + formatRupiah(row.ppn_faktur) + '</td>' +
                        '<td class="' + classSelisih + ' text-right" style="padding-right: 20px;">' + formatRupiah(selisih) + '</td>';
                    tbody.appendChild(tr);
                });

                // Build charts
                var labels = data.map(function(r) { return r.periode; });
                var ppnTukar = data.map(function(r) { return r.ppn_tukar; });
                var ppnFaktur = data.map(function(r) { return r.ppn_faktur; });
                var docTukar = data.map(function(r) { return r.jml_tukar; });
                var docFaktur = data.map(function(r) { return r.jml_faktur; });
                var colors = getChartColors();

                // PPN Chart
                if (chartPPN) chartPPN.destroy();
                chartPPN = new Chart(document.getElementById('chartPPN'), {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            { label: 'PPN (Tgl Tukar)', data: ppnTukar, borderColor: colors.ppnTukar, backgroundColor: colors.ppnTukar + '20', tension: 0.3, fill: true },
                            { label: 'PPN (Tgl Faktur)', data: ppnFaktur, borderColor: colors.ppnFaktur, backgroundColor: colors.ppnFaktur + '20', tension: 0.3, fill: true }
                        ]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { labels: { color: colors.text } } },
                        scales: {
                            x: { ticks: { color: colors.text }, grid: { color: colors.grid } },
                            y: { ticks: { color: colors.text, callback: function(v) { return 'Rp ' + (v/1000000).toFixed(0) + 'jt'; } }, grid: { color: colors.grid } }
                        }
                    }
                });

                // Dokumen Chart
                if (chartDokumen) chartDokumen.destroy();
                chartDokumen = new Chart(document.getElementById('chartDokumen'), {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            { label: 'Dok (Tgl Tukar)', data: docTukar, backgroundColor: colors.docTukar + 'cc', borderRadius: 6 },
                            { label: 'Dok (Tgl Faktur)', data: docFaktur, backgroundColor: colors.docFaktur + 'cc', borderRadius: 6 }
                        ]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { labels: { color: colors.text } } },
                        scales: {
                            x: { ticks: { color: colors.text }, grid: { color: colors.grid } },
                            y: { ticks: { color: colors.text }, grid: { color: colors.grid } }
                        }
                    }
                });

            } catch (err) {
                console.error("Gagal memuat summary", err);
                // BUG-5 FIX: Tampilkan pesan error di tabel agar user tahu ada masalah
                const tbody = document.getElementById('body-compare');
                if (tbody) tbody.innerHTML = `<tr><td colspan="6" class="text-center" style="padding: 20px; color: #ef4444;">⚠️ Gagal memuat data: ${err.message}</td></tr>`;
            } finally {
                // BUG-4 FIX: Re-enable tombol export setelah loading selesai (sukses maupun gagal)
                const btnExport = document.getElementById('btn-export-summary');
                if (btnExport) { btnExport.disabled = false; btnExport.style.opacity = '1'; btnExport.style.cursor = 'pointer'; }
            }
        }

        function exportSummaryCSV() {
            var table = document.getElementById('tabel-summary');
            var rows = table.querySelectorAll('tr');
            var csv = [];
            csv.push('"Periode","Jml Dok (Tukar)","PPN (Tukar)","Jml Dok (Faktur)","PPN (Faktur)","Selisih PPN"');
            var dataRows = document.querySelectorAll('#body-compare tr');
            dataRows.forEach(function(row) {
                var cols = row.querySelectorAll('td');
                var rowData = [];
                cols.forEach(function(col) {
                    var text = col.innerText.replace(/"/g, '""');
                    rowData.push('"' + text + '"');
                });
                csv.push(rowData.join(','));
            });
            var blob = new Blob(['\uFEFF' + csv.join('\n')], {type: 'text/csv;charset=utf-8;'});
            var link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'summary_' + aktifEntitas + '_' + new Date().toISOString().slice(0,10) + '.csv';
            link.click();
        }

        loadSummary();
    </script>
</body>
</html>
